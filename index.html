<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jimena Gómez Cardona</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b0838;--bg2:#2d0f5c;--card:#3a1a72;--ink:#f6efff;--soft:#cdb6f5;--green:#8ff0b0;--pink:#ff9de6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#1b0838}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% 0,var(--bg2),var(--bg) 60%) fixed;color:var(--ink);font-family:'Fredoka','Trebuchet MS',sans-serif;line-height:1.55;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:24px 18px 60px;position:relative}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.stars i{position:absolute;color:var(--soft);opacity:.5;animation:tw 3s infinite ease-in-out}
@keyframes tw{50%{opacity:.1;transform:scale(.6)}}
.wrap>*{position:relative;z-index:1}
.hero{text-align:center;padding:30px 0 10px}
.heart{font-size:64px;display:inline-block;animation:beat 1.4s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
h1{font-family:'Pacifico',cursive;font-weight:400;font-size:2.4rem;line-height:1.15;margin:8px 0;color:#fff;text-shadow:0 0 18px #b57bff}
.sub{color:var(--soft);margin:0}
.seven{display:flex;justify-content:center;gap:8px;margin:14px 0}
.seven span{width:14px;height:14px;background:var(--pink);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.seven span:nth-child(even){background:var(--green)}
.secret{margin:18px auto 0;display:block;background:none;border:2px dashed var(--pink);color:var(--pink);font:inherit;padding:10px 18px;border-radius:99px;cursor:pointer}
.secret:focus-visible,.chip:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.badge{margin:16px auto 0;width:176px;height:176px;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#4b1f94,#2a0d5a);border:3px solid var(--pink);box-shadow:0 0 0 6px #3a1a72,0 0 28px #b57bff;position:relative}
.badge b{font-size:1.9rem;letter-spacing:3px;color:#fff;line-height:1}
.badge small{display:block;color:var(--green);font-size:.8rem;letter-spacing:2px;margin-top:4px}
.badge .h{position:absolute;font-size:16px;left:50%;top:50%;transform:rotate(calc(var(--i)*51.43deg)) translateY(-78px) rotate(calc(var(--i)*-51.43deg)) translate(-50%,-50%)}
.badge .c{font-size:3.4rem;line-height:1;filter:drop-shadow(0 0 10px #b57bff)}
.badge .c{cursor:pointer;-webkit-tap-highlight-color:transparent}
.badge .c:active{transform:scale(.92)}
.p{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;pointer-events:none;z-index:5;transition:transform 1.1s cubic-bezier(.2,.8,.3,1),opacity 1.1s;font-size:22px;line-height:30px;text-align:center}
.p svg{width:100%;height:100%}
.me{display:block;width:134px;height:134px;border-radius:50%;object-fit:cover;border:3px solid var(--green);box-shadow:0 0 16px #b57bff}
.msg{max-height:0;overflow:hidden;transition:max-height .5s;text-align:center;color:var(--green)}
.msg.open{max-height:200px}
.msg p{margin:12px 0 0}
section{background:var(--card);border-radius:22px;padding:20px;margin-top:20px;border:1px solid #5a34a3}
section:nth-of-type(even){border-radius:22px 22px 60px 22px}
h2{margin:0 0 10px;font-size:1.25rem;color:var(--green)}
ul{margin:0;padding-left:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;color:var(--ink);background:#52299b;border:0;border-radius:99px;padding:8px 16px;cursor:pointer}
.chip.on{background:var(--green);color:#1b0838}
#trait{margin-top:12px;min-height:3em;color:var(--soft)}
.colors{display:flex;gap:14px}
.colors div{flex:1;border-radius:16px;padding:14px;color:#1b0838;font-size:.92rem}
.colors b{display:block;font-size:1.05rem}
.bar{height:12px;background:#24104a;border-radius:9px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#b57bff,var(--green));border-radius:9px}
.lema{text-align:center;background:linear-gradient(135deg,#6a2fc9,#3a1a72);border-radius:26px;padding:28px 18px}
.lema p{font-family:'Pacifico',cursive;font-size:1.5rem;margin:0;line-height:1.4}
footer{text-align:center;color:var(--soft);margin-top:26px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
